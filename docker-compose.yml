version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: proxy-gateway:local
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      CONFIG_PATH: /app/config.yaml
      TLS_CERT_FILE: /run/secrets/tls/tls.crt
      TLS_KEY_FILE: /run/secrets/tls/tls.key
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./certs:/run/secrets/tls:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      redis:
        condition: service_healthy
      backend1:
        condition: service_started
      backend2:
        condition: service_started
    networks:
      - proxy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    user: redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - volatile-ttl
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy

  backend1:
    image: python:3.12-slim
    restart: unless-stopped
    command: ["python", "-m", "http.server", "8000", "--directory", "/tmp"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy

  backend2:
    image: python:3.12-slim
    restart: unless-stopped
    command: ["python", "-m", "http.server", "8000", "--directory", "/tmp"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy

networks:
  proxy:
    driver: bridge